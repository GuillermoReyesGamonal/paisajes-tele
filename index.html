var DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function dosDig(n) { return (n < 10 ? "0" : "") + n; }
function reloj() {
  // Lima = UTC-5 todo el año; se lee en UTC para no depender de la zona horaria de la tele
  var t = new Date(Date.now() - 5 * 3600000);
  document.getElementById("hora").textContent = dosDig(t.getUTCHours()) + ":" + dosDig(t.getUTCMinutes());
  document.getElementById("fecha").textContent = DIAS[t.getUTCDay()] + ", " + t.getUTCDate() + " de " + MESES[t.getUTCMonth()];
}
function mezclar(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
var orden = mezclar(FOTOS.slice()), idx = 0, capa = 0, fallos = 0;
function siguienteFoto() {
  if (idx >= orden.length) { orden = mezclar(FOTOS.slice()); idx = 0; }
  var f = orden[idx++];
  var img = new Image();
  img.onload = function () {
    fallos = 0;
    var nueva = document.getElementById("f" + (1 - capa)), vieja = document.getElementById("f" + capa);
    nueva.style.backgroundImage = "url('" + f.u + "')";
    nueva.className = "foto ver"; vieja.className = "foto"; capa = 1 - capa;
    document.getElementById("lugar").textContent = f.l;
  };
  img.onerror = function () { if (++fallos < 20) siguienteFoto(); };
  img.src = f.u;
}
var frases = mezclar(FRASES.slice()), fi = 0;
function siguienteFrase() {
  var el = document.getElementById("frase"); el.style.opacity = 0;
  setTimeout(function () {
    if (fi >= frases.length) { frases = mezclar(FRASES.slice()); fi = 0; }
    var q = frases[fi++];
    document.getElementById("texto").textContent = "«" + q[0] + "»";
    document.getElementById("autor").textContent = q[1] ? "— " + q[1] : "";
    el.style.opacity = 1;
  }, 1500);
}
reloj(); setInterval(reloj, 1000);
siguienteFoto(); setInterval(siguienteFoto, 60000);
siguienteFrase(); setInterval(siguienteFrase, 5 * 60000);
</script>
